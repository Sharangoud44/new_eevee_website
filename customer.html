<!DOCTYPE html>
<html>
<head>
  <title>My Orders</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      padding: 20px;
    }

    h2 {
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: center;
    }

    th {
      background: #333;
      color: white;
    }

    tr:hover {
      background: #f1f1f1;
    }

    .status {
      font-weight: bold;
      color: orange;
    }

    .btn {
      padding: 5px 10px;
      background: green;
      color: white;
      text-decoration: none;
      border-radius: 4px;
    }
  </style>
</head>

<body>

<h2>My Orders</h2>

<table>
  <thead>
    <tr>
      <th>Order ID</th>
      <th>Job Name</th>
      <th>Status</th>
      <th>Payment</th>
      <th>Delivery</th>
      <th>Invoice</th>
    </tr>
  </thead>
  <tbody id="ordersTable"></tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, getDocs } 
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "eevee-printers.firebaseapp.com",
  projectId: "eevee-printers"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadOrders() {
  const querySnapshot = await getDocs(collection(db, "orders"));
  let html = "";

  querySnapshot.forEach((doc) => {
    const d = doc.data();

    html += `
      <tr>
        <td>${d.orderId}</td>
        <td>${d.jobName}</td>
        <td class="status">${d.status}</td>
        <td>₹${d.advancePaid} / ₹${d.totalAmount}</td>
        <td>${d.deliveryDate}</td>
        <td><a class="btn" href="${d.invoice}" target="_blank">View</a></td>
      </tr>
    `;
  });

  document.getElementById("ordersTable").innerHTML = html;
}

loadOrders();
</script>

</body>
</html>
