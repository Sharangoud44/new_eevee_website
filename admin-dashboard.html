<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f6f9;
      padding: 20px;
    }

    h2 {
      text-align: center;
    }

    .top-bar {
      text-align: right;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 15px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: center;
    }

    th {
      background: #333;
      color: white;
    }
  </style>
</head>

<body>

<h2>Admin Dashboard</h2>

<div class="top-bar">
  <button onclick="openForm()">+ Add Order</button>
</div>
<div id="popup" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5);">
  <div style="background:white; width:400px; margin:100px auto; padding:20px; border-radius:10px;">
    
    <h3>Add Order</h3>

    <input id="email" placeholder="Customer Email"><br><br>
    <input id="customerName" placeholder="Customer Name"><br><br>
    <input id="orderId" placeholder="Order ID"><br><br>
    <input id="jobName" placeholder="Job"><br><br>

    <select id="status">
      <option>New Order</option>
      <option>Printing</option>
      <option>Ready</option>
      <option>Delivered</option>
    </select><br><br>

    <input id="totalAmount" placeholder="Total Amount"><br><br>
    <input id="advancePaid" placeholder="Advance Paid"><br><br>

    <input id="deliveryDate" placeholder="Delivery Date"><br><br>

    <button onclick="addOrder()">Save</button>
    <button onclick="closeForm()">Close</button>

  </div>
</div>
<table>
  <thead>
    <tr>
      <th>Order ID</th>
      <th>Customer</th>
      <th>Job</th>
      <th>Status</th>
      <th>Payment</th>
      <th>Delivery</th>
    </tr>
  </thead>
  <tbody id="ordersTable"></tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc } 
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCSYwthBX2s99OiYJ0pcgr4ha6VfK214fk",
  authDomain: "eevee-printers.firebaseapp.com",
  projectId: "eevee-printers"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadOrders() {
  const querySnapshot = await getDocs(collection(db, "orders"));

  let html = "";

  querySnapshot.forEach((doc) => {
    const d = doc.data();

    html += `
  <tr>
    <td>${d.orderId || "-"}</td>
    <td>${d.customerName || "-"}</td>
    <td>${d.jobName || "-"}</td>
    <td>${d.status || "-"}</td>
    <td>₹${d.advancePaid || 0} / ₹${d.totalAmount || 0}</td>
    <td>${d.deliveryDate || "-"}</td>
  </tr>
`;
  });

  document.getElementById("ordersTable").innerHTML = html;
}

loadOrders();
window.addOrder = async function () {

  const total = Number(document.getElementById("totalAmount").value);
  const advance = Number(document.getElementById("advancePaid").value);

  const order = {
    email: document.getElementById("email").value,
    customerName: document.getElementById("customerName").value,
    orderId: document.getElementById("orderId").value,
    jobName: document.getElementById("jobName").value,
    status: document.getElementById("status").value,
    totalAmount: total,
    advancePaid: advance,
    deliveryDate: document.getElementById("deliveryDate").value
  };

  await addDoc(collection(db, "orders"), order);

  alert("Order Added ✅");

  closeForm();
  loadOrders(); // 🔥 refresh table
};
  function openForm() {
  document.getElementById("popup").style.display = "block";
}

function closeForm() {
  document.getElementById("popup").style.display = "none";
}
</script>

</body>
</html>
